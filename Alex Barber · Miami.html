<style>
:root{--k:#101317;--iv:#F2F0EB;--b:#176FE5;--g:#272D33;--m:#D8D9D7;--w:#fff;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,"Helvetica Neue",Arial,sans-serif;--pad:clamp(20px,5vw,72px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--k);color:var(--w);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.mu{font:500 11px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase}
.d{font-family:var(--serif);font-weight:500;line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
section,footer{position:relative;padding:clamp(72px,11vw,160px) var(--pad)}

/* photo slots: set PHOTOS below to fill with Alex's real images */
.ph{position:relative;background:var(--g);overflow:hidden;background-size:cover;background-position:center}
.ph.empty::after{content:attr(data-l);position:absolute;left:14px;bottom:12px;font:500 10px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.ph.empty{background-image:linear-gradient(160deg,#2f363d,#1a1f24)}
.rv{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.1,1)}
.rv.in{clip-path:inset(0)}

/* nav */
nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) var(--pad) 18px;transition:background .3s}
nav.s{background:rgba(16,19,23,.92)}
.wm{font:600 20px/1 var(--serif);letter-spacing:.32em}
.wm i{font-style:normal;color:var(--b)}
.nl{display:flex;gap:34px;align-items:center}
.nl a:not(.btn){opacity:.75;transition:opacity .2s}.nl a:not(.btn):hover{opacity:1}
.lg{background:none;border:0;color:inherit;cursor:pointer;opacity:.75;font:inherit}
.lg b{opacity:1;color:var(--b)}
.btn{display:inline-block;background:var(--b);color:var(--w);padding:16px 28px;font:700 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;position:relative;overflow:hidden;transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-120%);animation:sh 5s 2s infinite}
@keyframes sh{to{transform:translateX(120%)}}
.bg{display:none;background:none;border:0;color:inherit;width:44px;height:44px;cursor:pointer}
.bg span{display:block;width:26px;height:1.5px;background:currentColor;margin:7px auto;transition:.3s}

/* 1 hero */
#hero{min-height:100svh;padding-top:140px;padding-bottom:60px;display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;align-items:end;overflow:hidden}
#hero .ph{grid-column:7/13;grid-row:1/3;height:min(82svh,820px);align-self:end;margin-right:calc(var(--pad)*-1);transition-delay:.2s}
#hero h1{grid-column:1/9;grid-row:1;align-self:end;font-size:clamp(56px,11.5vw,190px);position:relative;z-index:2;margin-bottom:-.06em}
#hero h1 span{display:block;overflow:hidden}
#hero h1 em{display:block;font-style:normal;transform:translateY(105%);animation:up 1.1s cubic-bezier(.2,.7,.1,1) forwards}
#hero h1 span:nth-child(2) em{animation-delay:.12s;color:transparent;-webkit-text-stroke:1.5px var(--w)}
#hero h1 span:nth-child(3) em{animation-delay:.24s}
@keyframes up{to{transform:none}}
.hb{grid-column:1/6;grid-row:2;padding-top:48px;position:relative;z-index:2}
.hb p{font:500 22px/1.3 var(--serif);max-width:20em;margin-bottom:28px;color:var(--m)}
.hb .mu{display:block;margin-top:26px;opacity:.6}

/* 2 work */
#work{background:var(--iv);color:var(--k);display:grid;grid-template-columns:repeat(12,1fr);gap:24px 20px}
#work h2{grid-column:1/13;font-size:clamp(60px,13vw,220px);text-align:right;margin-bottom:-.1em;position:relative;z-index:2;mix-blend-mode:multiply}
#work .a{grid-column:1/7;aspect-ratio:4/5;grid-row:2/5}
#work .b{grid-column:8/11;aspect-ratio:1;grid-row:2;margin-top:12%}
#work .c{grid-column:10/13;aspect-ratio:3/4;grid-row:3;margin-top:-4%}
#work .d2{grid-column:7/10;aspect-ratio:4/3;grid-row:4;margin-top:-6%}
#work figcaption{position:absolute;top:14px;left:14px;font:700 10px/1 var(--sans);letter-spacing:.22em;background:var(--iv);color:var(--k);padding:7px 9px;z-index:2}
#work .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s}
#work .ph:hover{background-size:108%}

/* 3 services */
#svc{background:var(--g)}
#svc h2{font-size:clamp(48px,9vw,150px);max-width:9em;margin-bottom:clamp(40px,7vw,100px)}
#svc ol{list-style:none;padding:0;border-top:1px solid rgba(255,255,255,.18)}
#svc li{display:grid;grid-template-columns:clamp(70px,12vw,190px) 1fr 1.1fr;gap:20px;align-items:baseline;padding:clamp(22px,3vw,40px) 0;border-bottom:1px solid rgba(255,255,255,.18);position:relative;transition:padding .45s}
#svc li::before{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:0;background:var(--b);transition:width .6s}
#svc li:hover{padding-left:18px}#svc li:hover::before{width:100%}
#svc .n{font:500 clamp(44px,7vw,110px)/.8 var(--serif);color:var(--m);opacity:.4;transition:.4s}
#svc li:hover .n{color:var(--b);opacity:1}
#svc h3{font:500 clamp(28px,3.6vw,56px)/1 var(--serif)}
#svc p{color:var(--m);max-width:30em;font-size:15px}
#svc .nt{margin-top:28px;opacity:.55}

/* 4 about */
#about{background:var(--w);color:var(--k);display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;align-items:start}
#about .p1{grid-column:1/6;aspect-ratio:3/4}
#about .p2{grid-column:5/9;aspect-ratio:4/5;margin-top:-18%;margin-left:30%;width:70%;position:relative;z-index:2;border:10px solid var(--w);grid-row:2}
#about .tx{grid-column:8/13;grid-row:1;padding-top:6%}
#about h2{font-size:clamp(40px,5.6vw,92px);margin:22px 0 36px}
#about p{font:500 clamp(19px,1.7vw,24px)/1.45 var(--serif);margin-bottom:1em;max-width:26em}
#about .loc{display:block;margin-top:40px;color:var(--b)}
#about .p1{grid-row:1/3}

/* 5 details */
#det{background:var(--k);min-height:110svh;padding:0;overflow:hidden;display:grid}
#det .ph{position:absolute;inset:0 0 0 22%;opacity:.9}
#det .ph.empty{background-image:linear-gradient(120deg,#1f252b,#0c0f12)}
#det::before{content:"";position:absolute;z-index:1;left:var(--pad);top:0;width:2px;height:0;background:var(--b);transition:height 1.6s .3s}
#det.in::before{height:34%}
#det .t{position:relative;z-index:2;align-self:end;padding:0 var(--pad) clamp(48px,8vw,110px)}
#det h2{font-size:clamp(54px,12vw,200px);max-width:6.5em;text-shadow:0 2px 40px rgba(16,19,23,.6)}
#det p{max-width:24em;margin-top:28px;color:var(--m);font-size:15px}
#det .mu.top{position:absolute;z-index:2;top:130px;left:calc(var(--pad) + 24px);color:var(--b)}

/* 6 book */
#book{padding:0;display:grid;grid-template-columns:1.1fr .9fr;min-height:100svh}
#book .l{background:var(--b);padding:clamp(72px,10vw,140px) var(--pad);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
#book h2{font-size:clamp(52px,8vw,136px);margin-bottom:32px}
#book .l p{max-width:22em;font-size:18px;margin-bottom:40px}
#book .btn{background:var(--k)}
#book .btn::after{display:none}
#book .r{background:var(--k);padding:clamp(40px,5vw,72px);display:grid;grid-template-rows:1fr auto;gap:36px}
#book .r .ph{min-height:300px}
#book dl{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;font-size:14px;color:var(--m)}
#book dt{color:var(--b)}

/* 7 contact */
#contact{background:var(--iv);color:var(--k);display:grid;grid-template-columns:repeat(12,1fr);gap:40px 20px}
#contact h2{grid-column:1/8;font:500 clamp(40px,6vw,100px)/.95 var(--serif)}
#contact h2 i{color:var(--b);font-style:italic}
#contact ul{grid-column:9/13;list-style:none;padding:0;align-self:end}
#contact li{padding:18px 0;border-top:1px solid rgba(16,19,23,.2)}
#contact li .mu{display:block;opacity:.55;margin-bottom:6px}
#contact li a{border-bottom:1px solid var(--b)}
.tbc{opacity:.5}

/* 8 footer */
footer{background:var(--k);overflow:hidden;padding-bottom:30px}
footer .w{font:600 clamp(48px,15.5vw,270px)/.85 var(--serif);letter-spacing:-.01em;white-space:nowrap;margin:0 calc(var(--pad)*-1) 0 -.04em;color:var(--g)}
footer .r1{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14)}
footer .r1 div{display:flex;gap:26px;flex-wrap:wrap;opacity:.8}
footer .cp{margin-top:20px;opacity:.45}

@media(max-width:820px){
 .nl{position:fixed;inset:0;background:var(--k);flex-direction:column;justify-content:center;gap:28px;font:500 38px/1 var(--serif);transform:translateY(-100%);transition:transform .5s;z-index:-1}
 .nl a:not(.btn){opacity:1}.nl .btn{font:700 11px/1 var(--sans)}
 nav.o .nl{transform:none}nav.o{background:var(--k)}
 .bg{display:block;z-index:3}nav.o .bg span:first-child{transform:translateY(4px) rotate(45deg)}nav.o .bg span:last-child{transform:translateY(-4px) rotate(-45deg)}
 #hero{display:flex;flex-direction:column;align-items:stretch;padding-top:96px}
 #hero .ph{order:1;height:52svh;margin:0 calc(var(--pad)*-1)}

 #work h2{text-align:left;font-size:19vw}
 #work .a{aspect-ratio:4/5}#work .b,#work .c,#work .d2{margin:0;width:68%;aspect-ratio:1}#work .c{align-self:flex-end;aspect-ratio:3/4}
 #svc li{grid-template-columns:56px 1fr;gap:6px 14px}#svc li p{grid-column:2}

 #det .ph{inset:0}#det{min-height:100svh}
 #book{display:flex;flex-direction:column;min-height:0}#book .r .ph{min-height:260px}
 #contact{display:flex;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}#hero h1 em{transform:none}.rv{clip-path:none}}
